name: CareerOrbit CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: .NET 10 LTS Backend Build, Test & Quality Inspection
  # ----------------------------------------------------------------------------
  backend:
    name: .NET 10 Backend (Build & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'JobPortal.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore JobPortal.slnx

      - name: Build Solution (Release)
        run: dotnet build JobPortal.slnx --no-restore --configuration Release

      - name: Execute Automated Unit & Integration Tests
        run: dotnet test JobPortal.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  # ----------------------------------------------------------------------------
  # Job 2: Angular 22 Client (Zoneless Signals & Production Build)
  # ----------------------------------------------------------------------------
  frontend:
    name: Angular 22 Frontend (Build & Validate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Clean Dependencies
        run: npm ci

      - name: Build Production Client
        run: npm run build -- --configuration production

  # ----------------------------------------------------------------------------
  # Job 3: Docker Manifest & Compose Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Container Manifest Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate API Dockerfile Syntax
        run: docker build --check -f Dockerfile.api .

      - name: Validate Client Dockerfile Syntax
        run: docker build --check -f Dockerfile.client .
