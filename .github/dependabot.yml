version: 2
updates:
  # Maintain dependencies for NuGet packages (.NET 10)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dotnet-dependencies:
        patterns:
          - "Microsoft.*"
          - "Npgsql.*"

  # Maintain dependencies for npm packages (Angular 22)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      angular-dependencies:
        patterns:
          - "@angular/*"
