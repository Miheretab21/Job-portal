<div class="edit-job-page">

  <div class="form-card">

    <h1>Edit Job</h1>

    @if (isLoading) {

      <p class="loading">
        Loading job...
      </p>

    } @else {

      <form (ngSubmit)="updateJob()">

        <div class="form-group">

          <label for="title">
            Job Title
          </label>

          <input
            id="title"
            type="text"
            name="title"
            [(ngModel)]="job.title"
            required
          />

        </div>

        <div class="form-group">

          <label for="company">
            Company
          </label>

          <input
            id="company"
            type="text"
            name="company"
            [(ngModel)]="job.company"
            required
          />

        </div>

        <div class="form-group">

          <label for="location">
            Location
          </label>

          <input
            id="location"
            type="text"
            name="location"
            [(ngModel)]="job.location"
            required
          />

        </div>

        <div class="form-group">

          <label for="jobType">
            Job Type
          </label>

          <select
            id="jobType"
            name="jobType"
            [(ngModel)]="job.jobType"
            required
          >

            <option value="">
              Select job type
            </option>

            <option value="Full-time">
              Full-time
            </option>

            <option value="Part-time">
              Part-time
            </option>

            <option value="Contract">
              Contract
            </option>

            <option value="Remote">
              Remote
            </option>

          </select>

        </div>

        <div class="form-group">

          <label for="salary">
            Salary
          </label>

          <input
            id="salary"
            type="number"
            name="salary"
            [(ngModel)]="job.salary"
            min="0"
            required
          />

        </div>

        <div class="form-group">

          <label for="description">
            Job Description
          </label>

          <textarea
            id="description"
            name="description"
            [(ngModel)]="job.description"
            rows="6"
            required
          ></textarea>

        </div>

        <button
          type="submit"
          [disabled]="isSubmitting"
        >

          @if (isSubmitting) {
            Updating Job...
          } @else {
            Update Job
          }

        </button>

      </form>

    }

  </div>

</div>
