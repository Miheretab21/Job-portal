<div class="job-details-page">

  <div class="job-details-card">

    <h1>{{ job?.title }}</h1>

    <h2>{{ job?.company }}</h2>

    <div class="job-info">

      <p>
        <strong>Location:</strong>
        {{ job?.location }}
      </p>

      <p>
        <strong>Job Type:</strong>
        {{ job?.jobType }}
      </p>

      <p>
        <strong>Salary:</strong>
        {{ job?.salary }}
      </p>

      <p>
        <strong>Posted:</strong>
        {{ job?.postedDate | date }}
      </p>

    </div>

    <div class="description">

      <h3>Job Description</h3>

      <p>
        {{ job?.description }}
      </p>

    </div>

    <div class="actions">

      <button
        type="button"
        class="edit-button"
        (click)="editJob()"
      >
        Edit Job
      </button>

      <button
        type="button"
        class="delete-button"
        (click)="deleteJob()"
        [disabled]="isDeleting"
      >

        @if (isDeleting) {
          Deleting...
        } @else {
          Delete Job
        }

      </button>

    </div>

  </div>

</div>
